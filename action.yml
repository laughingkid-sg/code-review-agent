name: Intelligent Code Review Agent
description: Run code-rule or business-rule review for an existing GitHub pull request.

inputs:
  mode:
    description: Review mode to run. Use code-rules, business-rules, or aggregate.
    required: true
  config-path:
    description: Path to the target repository review config.
    required: false
    default: .code-review.yml
  knowledgebase-path:
    description: Path to the checked-out code-review-knowledgebase repository.
    required: false
    default: ../code-review-knowledgebase
  repository-path:
    description: Path to the target implementation repository.
    required: false
    default: .
  output-path:
    description: Markdown output path for review findings.
    required: true
  provider:
    description: LLM provider name. Use mock for deterministic dry-runs or llm for OpenAI-compatible review. qwen remains a backwards-compatible alias.
    required: false
    default: mock
  default-contributor:
    description: Fallback contributor used when a rule does not provide one.
    required: false
    default: codex
  comment-mode:
    description: Use dry_run to write artifacts only, or pr_comment to publish GitHub PR comments.
    required: false
    default: dry_run
  changed-files:
    description: Newline-separated changed file paths relative to the target repository.
    required: false
    default: ""
  audit-dir:
    description: Directory where provider request/response transcripts are written.
    required: false
    default: output
  summary-cache-ttl-days:
    description: Number of days a provider-generated PRD/TD summary may be reused.
    required: false
    default: "3"
  aggregate-inputs:
    description: Newline-separated review artifact paths to combine in aggregate mode.
    required: false
    default: ""
  artifact-links:
    description: Newline-separated artifact links formatted as label|url for the aggregate PR comment.
    required: false
    default: ""
  skills:
    description: Newline-separated application SKILLS names to inject into provider prompts. Overrides config skills.enabled when set.
    required: false
    default: ""
  pull-request-number:
    description: Pull request number override for non-pull_request events such as workflow_run.
    required: false
    default: ""
  head-sha:
    description: Pull request head SHA override for non-pull_request events such as workflow_run.
    required: false
    default: ""

outputs:
  review-output:
    description: Path to the generated markdown review output.
    value: ${{ inputs.output-path }}

runs:
  using: composite
  steps:
    - name: Install Python dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check "openai>=1.40.0" "PyYAML>=6.0"

    - name: Run code review agent
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        GITHUB_TOKEN: ${{ github.token }}
        CODE_REVIEW_PR_NUMBER: ${{ inputs.pull-request-number }}
        CODE_REVIEW_HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        args=()
        while IFS= read -r changed_file; do
          if [ -n "$changed_file" ]; then
            args+=(--changed-file "$changed_file")
          fi
        done <<< "${{ inputs.changed-files }}"
        aggregate_args=()
        while IFS= read -r aggregate_input; do
          if [ -n "$aggregate_input" ]; then
            aggregate_args+=(--aggregate-input "$aggregate_input")
          fi
        done <<< "${{ inputs.aggregate-inputs }}"
        artifact_link_args=()
        while IFS= read -r artifact_link; do
          if [ -n "$artifact_link" ]; then
            artifact_link_args+=(--artifact-link "$artifact_link")
          fi
        done <<< "${{ inputs.artifact-links }}"
        skill_args=()
        while IFS= read -r skill_name; do
          if [ -n "$skill_name" ]; then
            skill_args+=(--skill "$skill_name")
          fi
        done <<< "${{ inputs.skills }}"

        python -m code_review_agent run \
          --mode "${{ inputs.mode }}" \
          --config "${{ inputs.config-path }}" \
          --repository "${{ inputs.repository-path }}" \
          --knowledgebase "${{ inputs.knowledgebase-path }}" \
          --output "${{ inputs.output-path }}" \
          --provider "${{ inputs.provider }}" \
          --audit-dir "${{ inputs.audit-dir }}" \
          --comment-mode "${{ inputs.comment-mode }}" \
          --summary-cache-ttl-days "${{ inputs.summary-cache-ttl-days }}" \
          --default-contributor "${{ inputs.default-contributor }}" \
          "${args[@]}" \
          "${aggregate_args[@]}" \
          "${artifact_link_args[@]}" \
          "${skill_args[@]}"
